name: moneyy
description: "Un gestore di finanze personali completo, costruito con Flutter."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Pacchetti per l'interfaccia utente e icone
  cupertino_icons: ^1.0.6

  # Gestione del database locale
  sqflite: ^2.3.0
  path: ^1.8.3

  # State management
  provider: ^6.1.1

  # HTTP per OCR.space API
  http: ^1.2.0
  
  image: ^4.3.0
  
  # Preferenze utente (per salvare valuta, tema, etc.)
  shared_preferences: ^2.2.2

  # Localizzazione e formattazione
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Importazione/Esportazione file
  file_picker: ^8.0.0+1
  excel: ^2.1.0
  path_provider: ^2.1.1
  
  # Drag & Drop support
  desktop_drop: ^0.4.4
  
  # Scansione scontrini
  image_picker: ^1.0.7
  
  # Permission handler per galleria/fotocamera
  permission_handler: ^11.0.1
  
  # Liquid Glass Effect (Apple-style glassmorphism)
  # Nota: Il package è ancora in versione dev/experimental
  liquid_glass_renderer: ^0.2.0-dev.3
  image_cropper: ^11.0.0

  # Chart per reports (se non già presente)
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Configurazione specifica per Flutter
flutter:
  uses-material-design: true

  # Aggiungi questa cartella agli assets
  assets:
    - assets/images/
    - shaders/ # <-- ✅ AGGIUNGI QUESTA RIGA

  # Aggiungi questa nuova sezione
  shaders:
    - shaders/liquid_glass_lens.frag # <-- ✅ AGGIUNGI QUESTA SEZIONE
