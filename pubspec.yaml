name: moneyy
description: "Un gestore di finanze personali completo, costruito con Flutter."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Pacchetti per l'interfaccia utente e icone
  cupertino_icons: ^1.0.6

  # Gestione del database locale
  sqflite: ^2.3.0
  path: ^1.8.3

  # State management
  provider: ^6.1.1

  http: ^1.1.0
  google_generative_ai: ^0.4.3
  
  # Preferenze utente (per salvare valuta, tema, etc.)
  shared_preferences: ^2.2.2

  # Localizzazione e formattazione (allineata a flutter_localizations)
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # ✅ IMPORTAZIONE FILE AVANZATA (aggiornato per desktop)
  file_picker: ^8.0.0
  excel: ^2.1.0
  path_provider: ^2.1.1
  # ✅ DRAG & DROP SUPPORT
  desktop_drop: ^0.4.4
  
  # 📸 RECEIPT SCANNING
  image_picker: ^1.0.7
  # 🤖 LOCAL OCR FALLBACK
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fl_chart: ^0.66.2
  flutter_lints: ^3.0.0

# Configurazione specifica per Flutter
flutter:
  uses-material-design: true

  # Dichiarazione degli assets (immagini)
  assets:
    - assets/images/
